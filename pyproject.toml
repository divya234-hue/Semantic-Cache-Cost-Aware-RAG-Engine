[project]
name = "semantic-cache-rag"
version = "0.1.0"
description = "Tenant-scoped semantic cache and cost-aware RAG API"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Divya", email = "developer@example.com" }
]
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "pypdf>=4.2.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "qdrant-client>=1.9.0",
    "sentence-transformers>=3.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["backend", "."]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear
    "UP",  # pyupgrade (modern python idioms)
]
ignore = [
    "E501", # line-length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
